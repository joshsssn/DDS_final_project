[project]
name = "wikigame"
version = "1.0.0"
description = "Landmarks of the Wikipedia game: are intuitive landmark pages the best hubs of the French Wikipedia link graph?"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "duckdb",
    "matplotlib",
    "pyyaml",
    "requests",
    "beautifulsoup4",
    "psutil",
    "scipy",
]

[dependency-groups]
dev = ["pytest", "nbformat", "nbclient", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikigame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
